<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>要素式起诉状生成助手</title>
    <script type="text/javascript">
      window.__officeBootstrap = {
        scriptRequestedAt: Date.now(),
        scriptLoaded: false,
        scriptLoadFailed: false,
        onReadyResolved: false,
      };
      window.dispatchOfficeBootstrapChange = function () {
        window.dispatchEvent(new Event('office-bootstrap-change'));
      };
    </script>
    <script
      type="text/javascript"
      src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
      onload="window.__officeBootstrap.scriptLoaded = true; window.dispatchOfficeBootstrapChange();"
      onerror="window.__officeBootstrap.scriptLoadFailed = true; window.dispatchOfficeBootstrapChange();"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
